<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alumni - Computational Engineering</title>
  <link href="./assets/images/iithlogo.png" rel="icon">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <site-header></site-header>
  <main>
    <div class="page-hero">
      <h1 class="page-hero-title">Alumni</h1>
      <p class="page-hero-subtitle">IIT Hyderabad &mdash; Computational Engineering Graduates</p>
    </div>

    <div class="container" style="max-width: 1200px; margin: 0 auto; padding: var(--space-8) var(--space-4);">
      <div class="batch-nav" id="batch-nav">
        <!-- Rendered by JS -->
      </div>
      <div id="batch-panels-container">
        <!-- Rendered by JS -->
      </div>
    </div>
  </main>
  <site-footer></site-footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="components.js"></script>
  <script>
    const ALUMNI_BATCHES = {
      "2025": [
        { name: "AARYAN", email: "", linkedin: "http://www.linkedin.com/in/aaryan-kaushik-200abcd200", github: "https://github.com/aaryan200" },
        { name: "AAYUSH KUMAR", email: "", linkedin: "https://www.linkedin.com/in/aayush-kumar-b76a9223a/", github: "https://github.com/random-bee" },
        { name: "CHANDRA PRAKASH MEENA", email: "", linkedin: "", github: "" },
        { name: "DARPAN GAUR", email: "", linkedin: "https://www.linkedin.com/in/darpan-gaur/", github: "https://github.com/darpan-gaur" },
        { name: "GANTA PURAB", email: "", linkedin: "", github: "" },
        { name: "ISHAAN JAIN", email: "", linkedin: "https://www.linkedin.com/in/ishaan-jain-148775214", github: "https://github.com/ishaanjain1507" },
        { name: "KALALA ABHINAV", email: "", linkedin: "", github: "" },
        { name: "KONDAPALLI YOSHITA", email: "", linkedin: "https://www.linkedin.com/in/yoshita-kondapalli-041246240", github: "https://github.com/kyofie" },
        { name: "MEDIKONDA AKHILESH", email: "", linkedin: "", github: "" },
        { name: "P GAYATHRI SHREEYA", email: "", linkedin: "http://www.linkedin.com/in/gayathri-shreeya", github: "" }
      ]
    };

    const getInitials = (name) => {
      const parts = name.trim().split(' ');
      if (parts.length >= 2) return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
      return parts[0].slice(0, 2).toUpperCase();
    };

    const batchColors = {
      '2025': '#3a2e1a'
    };

    const mailIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>`;
    const linkedinIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>`;
    const githubIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>`;

    let activeBatch = "2025";
    const batchNav = document.getElementById('batch-nav');
    const batchPanelsContainer = document.getElementById('batch-panels-container');

    function render() {
      // Render Nav
      batchNav.innerHTML = Object.keys(ALUMNI_BATCHES).map(batch => {
        const isActive = activeBatch === batch ? 'active' : '';
        return `<button class="batch-tab ${isActive}" onclick="setActiveBatch('${batch}')">
          Batch ${batch} <span class="badge">${ALUMNI_BATCHES[batch].length}</span>
        </button>`;
      }).join('');

      // Render Panels
      batchPanelsContainer.innerHTML = Object.keys(ALUMNI_BATCHES).map(batch => {
        const isActive = activeBatch === batch ? 'active' : '';
        const studentsHtml = ALUMNI_BATCHES[batch].map(st => {
          const emailLink = st.email 
            ? `<a href="mailto:${st.email}" class="student-link" title="Email">${mailIcon}</a>`
            : `<span class="student-link no-link" aria-hidden="true">${mailIcon}</span>`;
          
          const linkedinLink = st.linkedin
            ? `<a href="${st.linkedin}" target="_blank" rel="noopener noreferrer" class="student-link" title="LinkedIn">${linkedinIcon}</a>`
            : `<span class="student-link no-link" aria-hidden="true">${linkedinIcon}</span>`;

          const githubLink = st.github
            ? `<a href="${st.github}" target="_blank" rel="noopener noreferrer" class="student-link" title="GitHub">${githubIcon}</a>`
            : `<span class="student-link no-link" aria-hidden="true">${githubIcon}</span>`;

          return `
            <div class="student-card">
              <div class="student-avatar" style="background: ${batchColors[batch] || '#2a3a4a'}">
                ${getInitials(st.name)}
              </div>
              <div class="student-info">
                <div class="student-name">${st.name}</div>
                ${st.email ? `<div class="student-email">${st.email}</div>` : ''}
                <div class="student-links">
                  ${emailLink}
                  ${linkedinLink}
                  ${githubLink}
                </div>
              </div>
            </div>
          `;
        }).join('');

        return `
          <div class="batch-panel ${isActive}">
            <div class="students-grid">
              ${studentsHtml}
            </div>
          </div>
        `;
      }).join('');
    }

    function setActiveBatch(batch) {
      activeBatch = batch;
      render();
    }

    // Initial render
    render();
  </script>
</body>
</html>
