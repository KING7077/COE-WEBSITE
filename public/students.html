    const getInitials = (name) => {
      const parts = name.trim().split(' ');
      if (parts.length >= 2) return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
      return parts[0].slice(0, 2).toUpperCase();
    };

    const batchNav = document.getElementById('batch-nav');
    const batchPanels = document.getElementById('batch-panels');

    let activeBatch = '2026';

    function render() {
      batchNav.innerHTML = '';
      batchPanels.innerHTML = '';
      
      Object.keys(BATCHES).forEach(batch => {
        const btn = document.createElement('button');
        btn.className = `batch-tab ${activeBatch === batch ? 'active' : ''}`;
        btn.onclick = () => {
          activeBatch = batch;
          render();
        };
        btn.innerHTML = `Batch ${batch} <span class="badge">${BATCHES[batch].length}</span>`;
        batchNav.appendChild(btn);

        const panel = document.createElement('div');
        panel.className = `batch-panel ${activeBatch === batch ? 'active' : ''}`;
        
        const grid = document.createElement('div');
        grid.className = 'students-grid';

        BATCHES[batch].forEach(st => {
          const card = document.createElement('div');
          card.className = 'student-card';

          const lnkLinked = st.linkedin ? `<a href="${st.linkedin}" target="_blank" rel="noopener noreferrer" class="student-link" title="LinkedIn">${linkedinIcon}</a>` : `<span class="student-link no-link" aria-hidden="true">${linkedinIcon}</span>`;
          const lnkGit = st.github ? `<a href="${st.github}" target="_blank" rel="noopener noreferrer" class="student-link" title="GitHub">${githubIcon}</a>` : `<span class="student-link no-link" aria-hidden="true">${githubIcon}</span>`;

          card.innerHTML = `
            <div class="student-avatar" style="background: ${batchColors[batch]}">
              ${getInitials(st.name)}
            </div>
            <div class="student-info">
              <div class="student-name">${st.name}</div>
              <div class="student-email">${st.email}</div>
              <div class="student-links">
                <a href="mailto:${st.email}" class="student-link" title="Email">
                  ${mailIcon}
                </a>
                ${lnkLinked}
                ${lnkGit}
              </div>
            </div>
          `;
          grid.appendChild(card);
        });

        panel.appendChild(grid);
        batchPanels.appendChild(panel);
      });
    }

    render();
  </script>
