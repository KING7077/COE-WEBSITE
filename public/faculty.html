<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty - Computational Engineering</title>
  <link href="./assets/images/iithlogo.png" rel="icon">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <site-header></site-header>
  <main>
    <div class="page-hero">
      <h1 class="page-hero-title">Faculty Members</h1>
      <p class="page-hero-subtitle">Meet our distinguished professors and researchers</p>
    </div>

    <div class="container py-5" style="max-width: 1200px; margin: 0 auto">
      <p class="section-subtitle text-center">18 faculty members across interdisciplinary engineering departments</p>
      <div class="faculty-grid" id="faculty-grid">
        <!-- Faculty cards generated by JS -->
      </div>
    </div>
  </main>
  <site-footer></site-footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="components.js"></script>
  <script>
    const facultyList = [
      { name: 'Sathya Peri', role: 'HOD(COE) & Professor', room: 'CSE-304', img: 'https://iith.ac.in/assets/images/profiles/Sathya-Peri.jpg', link: 'https://people.iith.ac.in/sathya_p/' },
      { name: 'Saswata Bhattacharya', role: 'DUGC(CO) & HOD(MSME) & Professor', room: 'MSME-402', img: 'https://iith.ac.in/assets/images/profiles/Saswata_Bhattacharya.jpg', link: 'https://www.iith.ac.in/msme/saswata/' },
      { name: 'Amit Acharyya', role: 'Professor', room: 'C-505', img: 'https://people.iith.ac.in/amit_acharyya/images/Amit.jpg', link: 'https://iith.ac.in/ee/amit_acharyya/' },
      { name: 'Anuj Goyal', role: 'Assistant Professor', room: 'MSME-204', img: 'https://www.iith.ac.in/assets/images/profiles/anujgoyal.jpg', link: 'https://iith.ac.in/msme/anujgoyal/' },
      { name: 'Amirtham Rajagopal', role: 'Professor', room: 'B-521', img: 'https://www.iith.ac.in/assets/images/profiles/Amirtham_Rajagopal.jpg', link: 'https://iith.ac.in/ce/rajagopal/' },
      { name: 'G Narahari Sastry', role: 'Professor', room: 'Admin Block - 402', img: 'https://iith.ac.in/assets/images/profiles/Prof_G_Narahari_Sastry.jpg', link: 'https://iith.ac.in/bt/gnsastry/' },
      { name: 'Harikrishnan Narayanan Unni', role: 'Associate Professor', room: 'C-445', img: 'https://www.iith.ac.in/assets/images/profiles/Harikrishnan_Narayanan_Unni.jpg', link: 'https://iith.ac.in/bme/harikrishnan/' },
      { name: 'Kishalay Mitra', role: 'Professor', room: 'C-404', img: 'https://iith.ac.in/assets/images/profiles/Kishalay_Mitra.jpg', link: 'https://iith.ac.in/che/kishalay/' },
      { name: 'Niranjan S Ghaisas', role: 'Assistant Professor', room: 'C-213/F', img: 'https://iith.ac.in/assets/images/profiles/Niranjan_S_Ghaisas.jpg', link: 'https://www.iith.ac.in/mae/nghaisas/' },
      { name: 'Prabhat Kumar', role: 'Assistant Professor', room: 'C-213', img: 'https://iith.ac.in/assets/images/profiles/prabhat-kumar.jpg', link: 'https://iith.ac.in/mae/pkumar/' },
      { name: 'Rahul Kumar', role: 'Assistant Professor', room: 'A-718/G', img: 'https://iith.ac.in/assets/images/profiles/Rahul_BT.jpg', link: 'https://iith.ac.in/bt/rahulk/' },
      { name: 'Raja Banerjee', role: 'Professor', room: 'C-511', img: 'https://www.iith.ac.in/assets/images/profiles/Raja_Banerjee.jpg', link: 'https://iith.ac.in/mae/rajabanerjee/' },
      { name: 'Sachidananda Behera', role: 'Assistant Professor', room: 'C-Block', img: 'https://iith.ac.in/assets/images/profiles/Sachidananda-Behera.jpg', link: 'https://iith.ac.in/mae/sbehera/' },
      { name: 'Sai Sidhardh', role: 'Assistant Professor', room: 'A-718/B', img: 'https://www.iith.ac.in/assets/images/profiles/Sai_Sidhardh.jpg', link: 'https://www.iith.ac.in/mae/sidhardh/' },
      { name: 'Saptarshi Majumdar', role: 'Professor', room: 'A-611', img: 'https://www.iith.ac.in/assets/images/profiles/majumdar.jpg', link: 'https://www.iith.ac.in/che/saptarshi/' },
      { name: 'Sayak Banerjee', role: 'Associate Professor', room: 'C-545', img: 'https://www.iith.ac.in/assets/images/profiles/Sayak_Banerjee.jpg', link: 'https://www.iith.ac.in/mae/sayakb/' },
      { name: 'Shelaka Gupta', role: 'Assistant Professor', room: 'C-214/A', img: 'https://iith.ac.in/assets/images/profiles/Shelaka-Gupta.png', link: 'https://www.iith.ac.in/che/shelaka/' },
      { name: 'Subhradeep Chatterjee', role: 'Associate Professor', room: 'MSME-301', img: 'https://iith.ac.in/assets/images/profiles/Subhradeep_Chatterjee.jpg', link: 'https://www.iith.ac.in/msme/subhradeep/' }
    ];

    const mapPinSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-map-pin"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>`;
    const externalLinkSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-external-link"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>`;

    const grid = document.getElementById('faculty-grid');
    facultyList.forEach(f => {
      const card = document.createElement('div');
      card.className = 'faculty-card';
      card.innerHTML = `
        <img src="${f.img}" alt="${f.name}" class="faculty-img" />
        <h4 class="faculty-name">${f.name}</h4>
        <div class="faculty-role">${f.role}</div>
        <div class="faculty-room">${mapPinSvg} ${f.room}</div>
        <div style="margin-top: auto; padding-top: var(--space-4); width: 100%">
          <a href="${f.link}" target="_blank" rel="noopener noreferrer" class="btn btn-secondary btn-sm">
            Know More ${externalLinkSvg}
          </a>
        </div>
      `;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
