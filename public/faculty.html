<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty | Computational Engineering, IIT Hyderabad</title>
  <meta name="description" content="Faculty members of the Computational Engineering program at IIT Hyderabad.">
  <link rel="icon" href="./assets/images/iithlogo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.iith.ac.in">
  <link rel="preconnect" href="https://iith.ac.in">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <site-header></site-header>

  <main id="main">
    <section class="page-hero">
      <div class="container">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span aria-hidden="true">/</span><span>People</span><span aria-hidden="true">/</span><span>Faculty</span></nav>
        <h1>Faculty Members</h1>
        <p>Meet our distinguished professors and researchers</p>
      </div>
    </section>

    <section class="section-tight">
      <div class="container">
        <div class="toolbar">
          <p class="muted" id="faculty-count"></p>
          <label class="search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <span class="visually-hidden">Search faculty</span>
            <input type="search" id="faculty-search" placeholder="Search by name or role">
          </label>
        </div>
        <div class="people-grid" id="faculty-grid"></div>
      </div>
    </section>
  </main>

  <site-footer></site-footer>

  <script src="components.js"></script>
  <script>
    const facultyList = [
      { name: 'Sayak Banerjee', role: 'HOD (CO) & Associate Professor', room: 'C-513', img: './assets/images/hod-sayak-banerjee.png', link: 'https://www.iith.ac.in/mae/sayakb/', hod: true },
      { name: 'Saswata Bhattacharya', role: 'DUGC (CO) & Professor', room: 'MSME-402', img: 'https://www.iith.ac.in/assets/images/profiles/Saswata_Bhattacharya.jpg', link: 'https://www.iith.ac.in/msme/saswata/' },
      { name: 'Niranjan S. Ghaisas', role: 'DFPC (CO) & Assistant Professor', room: 'C-213/F', img: 'https://iith.ac.in/assets/images/profiles/Niranjan_S_Ghaisas.jpg', link: 'https://www.iith.ac.in/mae/nghaisas/' },
      { name: 'Sathya Peri', role: 'Professor', room: 'CSE-304', img: 'https://iith.ac.in/assets/images/profiles/Sathya-Peri.jpg', link: 'https://people.iith.ac.in/sathya_p/' },
      { name: 'Amit Acharyya', role: 'Professor', room: 'C-505', img: 'https://people.iith.ac.in/amit_acharyya/images/Amit.jpg', link: 'https://iith.ac.in/ee/amit_acharyya/' },
      { name: 'Anuj Goyal', role: 'Assistant Professor', room: 'MSME-204', img: 'https://www.iith.ac.in/assets/images/profiles/anujgoyal.jpg', link: 'https://iith.ac.in/msme/anujgoyal/' },
      { name: 'Amirtham Rajagopal', role: 'Professor', room: 'B-521', img: 'https://www.iith.ac.in/assets/images/profiles/Amirtham_Rajagopal.jpg', link: 'https://iith.ac.in/ce/rajagopal/' },
      { name: 'G Narahari Sastry', role: 'Professor', room: 'Admin Block - 402', img: 'https://iith.ac.in/assets/images/profiles/Prof_G_Narahari_Sastry.jpg', link: 'https://iith.ac.in/bt/gnsastry/' },
      { name: 'Harikrishnan Narayanan Unni', role: 'Associate Professor', room: 'C-445', img: 'https://www.iith.ac.in/assets/images/profiles/Harikrishnan_Narayanan_Unni.jpg', link: 'https://iith.ac.in/bme/harikrishnan/' },
      { name: 'Kishalay Mitra', role: 'Professor', room: 'C-404', img: 'https://iith.ac.in/assets/images/profiles/Kishalay_Mitra.jpg', link: 'https://iith.ac.in/che/kishalay/' },
      { name: 'Prabhat Kumar', role: 'Assistant Professor', room: 'C-213', img: 'https://iith.ac.in/assets/images/profiles/prabhat-kumar.jpg', link: 'https://iith.ac.in/mae/pkumar/' },
      { name: 'Rahul Kumar', role: 'Assistant Professor', room: 'A-718/G', img: 'https://iith.ac.in/assets/images/profiles/Rahul_BT.jpg', link: 'https://iith.ac.in/bt/rahulk/' },
      { name: 'Raja Banerjee', role: 'Professor', room: 'C-511', img: 'https://www.iith.ac.in/assets/images/profiles/Raja_Banerjee.jpg', link: 'https://iith.ac.in/mae/rajabanerjee/' },
      { name: 'Sachidananda Behera', role: 'Assistant Professor', room: 'C-Block', img: 'https://iith.ac.in/assets/images/profiles/Sachidananda-Behera.jpg', link: 'https://iith.ac.in/mae/sbehera/' },
      { name: 'Sai Sidhardh', role: 'Assistant Professor', room: 'A-718/B', img: 'https://www.iith.ac.in/assets/images/profiles/Sai_Sidhardh.jpg', link: 'https://www.iith.ac.in/mae/sidhardh/' },
      { name: 'Saptarshi Majumdar', role: 'Professor', room: 'A-611', img: 'https://www.iith.ac.in/assets/images/profiles/majumdar.jpg', link: 'https://www.iith.ac.in/che/saptarshi/' },
      { name: 'Shelaka Gupta', role: 'Assistant Professor', room: 'C-214/A', img: 'https://iith.ac.in/assets/images/profiles/Shelaka-Gupta.png', link: 'https://www.iith.ac.in/che/shelaka/' },
      { name: 'Subhradeep Chatterjee', role: 'Associate Professor', room: 'MSME-301', img: 'https://iith.ac.in/assets/images/profiles/Subhradeep_Chatterjee.jpg', link: 'https://www.iith.ac.in/msme/subhradeep/' },
    ];

    const pinIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>';
    const arrow = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg>';

    const grid = document.getElementById('faculty-grid');
    const search = document.getElementById('faculty-search');
    document.getElementById('faculty-count').textContent =
      `${facultyList.length} faculty members across interdisciplinary engineering departments`;

    function render() {
      const q = search.value.trim().toLowerCase();
      const list = facultyList.filter(f => !q || `${f.name} ${f.role} ${f.room}`.toLowerCase().includes(q));
      grid.innerHTML = list.length ? list.map(f => `
        <article class="person">
          <div class="person-photo">
            <img src="${esc(f.img)}" alt="${esc(f.name)}" loading="lazy" decoding="async">
            ${f.hod ? '<span class="person-badge">HOD</span>' : ''}
          </div>
          <div class="person-body">
            <h2 class="person-name">${esc(f.name)}</h2>
            <div class="person-role">${esc(f.role)}</div>
            <div class="person-meta">${pinIcon}${esc(f.room)}</div>
            <a class="link-arrow person-link" href="${esc(f.link)}" target="_blank" rel="noopener noreferrer">Know more ${arrow}<span class="visually-hidden"> about ${esc(f.name)}</span></a>
          </div>
        </article>`).join('')
        : `<p class="empty-state" style="grid-column: 1 / -1;">No faculty match “${esc(search.value)}”.</p>`;
    }
    search.addEventListener('input', render);
    render();
  </script>
</body>
</html>
